services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recruit
      POSTGRES_PASSWORD: recruit
      POSTGRES_DB: recruitment
    ports:
      - "5432:5432"
    volumes:
      - recruitment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruit -d recruitment"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://recruit:recruit@db:5432/recruitment
      JWT_SECRET: local-development-secret-change-me-before-deployment
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - resume_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  web:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/workspace
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
volumes:
  recruitment_data:
  resume_data:
